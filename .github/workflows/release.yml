name: Release Android APK

# Builds a signed APK with the repo's own build script and publishes it as a
# GitHub Release whenever a PR is merged into main (or manually dispatched).

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-android
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Restore .env from repository secret
        env:
          DOTENV: ${{ secrets.DOTENV }}
        run: |
          printf '%s\n' "$DOTENV" > .env
          [ -s .env ] || { echo "::error::DOTENV secret is not set (or empty). Add it under Settings > Secrets and variables > Actions."; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Build release APK
        run: npm run build:android:apk

      - name: Resolve released version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Releasing v$VERSION"

      - name: Create GitHub release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" --title "v$VERSION" --generate-notes dist/android/*.apk

      - name: Push version bump back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): bump version to $VERSION [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
